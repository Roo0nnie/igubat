name: mobile
description: "A Flutter mobile app for the Turbo Template monorepo."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.5

  # Launching external apps (phone dialer, maps)
  url_launcher: ^6.3.1

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Functional error handling (Either<Failure, T>)
  fpdart: ^1.1.0

  # Navigation
  go_router: ^16.3.0
  persistent_bottom_nav_bar_v2: ^6.2.0

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Environment
  flutter_dotenv: ^6.0.0

  # Secure storage
  flutter_secure_storage: ^10.0.0

  # Theming
  flex_color_scheme: ^8.3.1

  # Local storage for preferences
  shared_preferences: ^2.5.3

  # Onboarding
  introduction_screen: ^4.0.0

  # Snackbar notifications
  awesome_snackbar_content: ^0.1.8

  # Toast notifications
  toastification: ^3.0.3

  # Feature tour / showcase
  showcaseview: ^5.0.1

  # Local push notifications
  awesome_notifications: ^0.11.0

  # Animations
  flutter_animate: ^4.5.2

  # Markdown rendering
  flutter_markdown: ^0.7.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

  # Branding: app icon + native splash (regenerate after editing assets/branding/)
  #   dart run flutter_launcher_icons && dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  color_dark: "#0F3D26"
  image_dark: assets/branding/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
    color_dark: "#0F3D26"
    image_dark: assets/branding/splash_android12.png
  ios: false
  web: false
